<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Why the later public pipelines improved</title>
  <desc id="desc">Concept diagram comparing the July model family with later public pipelines.</desc>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="60" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">What Was Missing Before the 0.94+ Jump?</text>
  <text x="60" y="74" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">The gap was not one knob. It was a later model stack with new checkpoints, ensemble logic, and specialized gates.</text>
  <rect x="60" y="115" width="390" height="330" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="530" y="115" width="390" height="330" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="90" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">July Family (~0.896)</text>
  <text x="560" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Later Public Stack (0.944+)</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#374151">
    <text x="95" y="200">• Single-family temporal graph model</text>
    <text x="95" y="232">• Threshold and short-track tuning</text>
    <text x="95" y="264">• Safe division heuristics</text>
    <text x="95" y="296">• Gap/relink experiments</text>
    <text x="95" y="328">• Local proxy instability</text>
    <text x="95" y="360">• From-scratch training underfit</text>
    <text x="95" y="392">• Appearance/self-supervision weak</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">
    <text x="565" y="200">• DeepCenter center-prior detector</text>
    <text x="565" y="232">• Independent temporal seed/checkpoint</text>
    <text x="565" y="264">• Harmonic bidirectional fusion</text>
    <text x="565" y="296">• Detection and edge-feature TTA</text>
    <text x="565" y="328">• Density-adaptive geometry</text>
    <text x="565" y="360">• DivNet 3D division gate</text>
    <text x="565" y="392">• Fast dual-T4 ILP execution</text>
  </g>
  <path d="M460 280 C490 250, 500 250, 525 280" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="420" y="475" font-family="Arial, sans-serif" font-size="15" fill="#111827" font-weight="700">Interpretation:</text>
  <text x="515" y="475" font-family="Arial, sans-serif" font-size="15" fill="#374151">we saturated a model family; later public assets changed the family.</text>
</svg>
